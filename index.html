<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>霧灯のリリウム: 深層迷宮</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="main-screen">
        <header class="topbar">
          <div>
            <h1>霧灯のリリウム</h1>
            <p id="place">星霧地下迷宮 B1</p>
          </div>
          <div class="controls">
            <button id="saveBtn" type="button">保存</button>
            <button id="resetBtn" type="button">最初から</button>
          </div>
        </header>

        <div class="viewport-wrap">
          <canvas id="viewport" width="720" height="460" aria-label="3Dダンジョン表示"></canvas>
          <div id="encounterFlash" class="encounter-flash hidden"></div>
          <div id="rangeBadge" class="range-badge">前方確認中</div>
          <div id="battle" class="battle hidden">
            <section class="battle-card">
              <div class="enemy-plate">
                <canvas id="enemySprite" class="enemy-sprite" width="160" height="160"></canvas>
                <div>
                  <h2 id="battleTitle">遭遇</h2>
                  <p id="battleText"></p>
                </div>
              </div>
              <div id="battleStats" class="battle-stats"></div>
              <div id="battleActions" class="actions"></div>
              <p class="battle-help">←/→ または W/A/S/D で選択、Enter/Spaceで決定、1〜5で直接選択</p>
            </section>
          </div>
        </div>

        <section class="command-deck" aria-label="移動操作">
          <button id="turnLeft" type="button">↶ 左を向く</button>
          <button id="forward" type="button">↑ 前進</button>
          <button id="turnRight" type="button">↷ 右を向く</button>
          <button id="strafeLeft" type="button">← 左へ寄る</button>
          <button id="back" type="button">↓ 後退</button>
          <button id="strafeRight" type="button">→ 右へ寄る</button>
          <button id="inspect" type="button">調べる</button>
        </section>

        <p id="message" class="message"></p>
      </section>

      <aside class="sidebar">
        <section class="navigator">
          <h2>リリウム</h2>
          <div id="livePortrait" class="live-portrait calm" aria-label="Live2D風ナビゲーター">
          </div>
          <p id="navigatorLine">霧の奥を見ています。壁の気配に注意して。</p>
        </section>

        <section class="party">
          <h2>パーティ</h2>
          <div id="partyList"></div>
        </section>

        <section class="map-panel">
          <h2>地図</h2>
          <p id="objective" class="objective">星鍵を探す</p>
          <canvas id="miniMap" width="192" height="192" aria-label="ミニマップ"></canvas>
          <div class="legend" aria-label="地図の凡例">
            <span><i class="path"></i>通路</span>
            <span><i class="event"></i>未回収</span>
            <span><i class="boss"></i>扉</span>
          </div>
          <dl>
            <div><dt>向き</dt><dd id="direction">北</dd></div>
            <div><dt>金貨</dt><dd id="gold">0</dd></div>
            <div><dt>薬草</dt><dd id="herbs">0</dd></div>
            <div><dt>星鍵</dt><dd id="keys">0/3</dd></div>
          </dl>
        </section>

        <section class="guide">
          <h2>操作</h2>
          <p>W/↑ 前進、S/↓ 後退、A/← 左を向く、D/→ 右を向く。Q/Eで横移動、F/Spaceで調べる。</p>
        </section>
      </aside>
    </main>

    <script src="game.js"></script>
  </body>
</html>
